<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<link rel="stylesheet" href="/css/item.css">

<title>Listagem de Itens</title>


</head>

<body>


<div class="container">

    <h1>Itens</h1>

    <p class="subtitulo">
        Consulte e pesquise os itens cadastrados.
    </p>


    <!-- Área de incluir -->

    <div class="area-incluir">

        <button id="btn-incluir" class="botao-incluir">

            + Incluir item

        </button>

    </div>


    <!-- Área de pesquisa e filtros -->

    <div class="filtros">

        <div class="campo">

            <label for="pesquisa">
                Pesquisar item
            </label>

            <input
                type="text"
                id="pesquisa"
                placeholder="Digite o nome do item..."
            >

        </div>


        <div class="campo">

            <label for="categoria">
                Categoria
            </label>

            <select id="categoria">

                <option value="">
                    Todas
                </option>

                <option value="0">
                    0
                </option>

                <option value="I">
                    I
                </option>

                <option value="II">
                    II
                </option>

                <option value="III">
                    III
                </option>

                <option value="IV">
                    IV
                </option>

            </select>

        </div>


        <div class="campo">

            <label for="classificacao">
                Classificação
            </label>

            <select id="classificacao">

                <option value="">
                    Todas
                </option>

                <option value="Armas">
                    Armas
                </option>

                <option value="Poções">
                    Poções
                </option>

                <option value="Maldições">
                    Maldições
                </option>

                <option value="Itens Amaldiçoados">
                    Itens Amaldiçoados
                </option>

                <option value="Itens Gerais">
                    Itens Gerais
                </option>

            </select>

        </div>


        <button
            type="button"
            class="botao-filtrar">

            Filtrar

        </button>

    </div>


    <!-- Tabela de itens -->

    <div class="tabela-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Classificação</th>
                    <th>Dano</th>
                    <th>Crítico</th>
                    <th>Alcance</th>
                    <th>Espaço</th>
                    <th>Descrição</th>
                    <th>Ações</th>

                </tr>

            </thead>


            <tbody id="tabela-itens">

            </tbody>

        </table>

    </div>

</div>


<!-- Modal de cadastro -->

<div id="modal-item" class="modal">

    <div class="modal-conteudo">


        <div class="modal-cabecalho">

            <h2>
                Novo Item
            </h2>

            <button
                id="fechar-modal"
                class="fechar">

                &times;

            </button>

        </div>


        <form id="form-item">


            <div class="campo">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    required>

            </div>


            <!-- CATEGORIA -->

            <div class="campo">

                <label for="categoria-item">
                    Categoria
                </label>

                <select
                    id="categoria-item"
                    required>

                    <option value="">
                        Selecione...
                    </option>

                    <option value="0">
                        0
                    </option>

                    <option value="I">
                        I
                    </option>

                    <option value="II">
                        II
                    </option>

                    <option value="III">
                        III
                    </option>

                    <option value="IV">
                        IV
                    </option>

                </select>

            </div>


            <!-- CLASSIFICAÇÃO -->

            <div class="campo">

                <label for="classificacao-item">
                    Classificação
                </label>

                <select
                    id="classificacao-item"
                    required>

                    <option value="">
                        Selecione...
                    </option>

                    <option value="Armas">
                        Armas
                    </option>

                    <option value="Poções">
                        Poções
                    </option>

                    <option value="Maldições">
                        Maldições
                    </option>

                    <option value="Itens Amaldiçoados">
                        Itens Amaldiçoados
                    </option>

                    <option value="Itens Gerais">
                        Itens Gerais
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="dano">
                    Dano
                </label>

                <input
                    type="text"
                    id="dano">

            </div>


            <div class="campo">

                <label for="critico">
                    Crítico
                </label>

                <input
                    type="text"
                    id="critico">

            </div>


            <div class="campo">

                <label for="alcance">
                    Alcance
                </label>

                <input
                    type="text"
                    id="alcance">

            </div>


            <div class="campo">

                <label for="espaco">
                    Espaço
                </label>

                <input
                    type="number"
                    step="0.1"
                    id="espaco">

            </div>


            <div class="campo">

                <label for="descricao">
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    rows="4">
                </textarea>

            </div>


            <div class="modal-botoes">

                <button
                    type="button"
                    id="cancelar"
                    class="botao-cancelar">

                    Cancelar

                </button>


                <button
                    type="submit"
                    class="botao-cadastrar">

                    Cadastrar

                </button>

            </div>

        </form>

    </div>

</div>


<script>


    let itens = [];


    async function carregarItens() {

        const resposta = await fetch('/api/item');

        itens = await resposta.json();

        mostrarItens(itens);

    }


    function mostrarItens(lista) {

        const tabela =
            document.querySelector('#tabela-itens');

        tabela.innerHTML = '';


        lista.forEach(item => {

            const linha =
                document.createElement('tr');


            linha.innerHTML = `

                <td>${item.id}</td>

                <td>${item.nome}</td>

                <td>${item.categoria}</td>

                <td>${item.classificacao}</td>

                <td>${item.dano}</td>

                <td>${item.critico}</td>

                <td>${item.alcance}</td>

                <td>${item.espaco}</td>

                <td>${item.descricao}</td>

                <td class="acoes">

                    <button
                        class="botao-editar"
                        onclick="editarItem(${item.id})">

                        Editar

                    </button>

                    <button
                        class="botao-excluir"
                        onclick="excluirItem(${item.id})">

                        Excluir

                    </button>

                </td>

            `;


            tabela.appendChild(linha);

        });

    }


    async function excluirItem(id) {

        const confirmar = confirm(
            'Tem certeza que deseja excluir este item?'
        );


        if (!confirmar) {

            return;

        }


        const resposta =
            await fetch(`/api/item/${id}`, {

                method: 'DELETE'

            });


        if (resposta.ok) {

            alert('Item excluído com sucesso!');

            carregarItens();

        } else {

            alert('Erro ao excluir o item.');

        }

    }


    function filtrarItens() {

        const textoPesquisa =
            document
                .querySelector('#pesquisa')
                .value
                .toLowerCase();


        const categoriaSelecionada =
            document
                .querySelector('#categoria')
                .value;


        const classificacaoSelecionada =
            document
                .querySelector('#classificacao')
                .value;


        const itensFiltrados =
            itens.filter(item => {

                const nomeCombina =
                    item.nome
                        .toLowerCase()
                        .includes(textoPesquisa);


                const categoriaCombina =
                    categoriaSelecionada === '' ||
                    item.categoria === categoriaSelecionada;


                const classificacaoCombina =
                    classificacaoSelecionada === '' ||
                    item.classificacao === classificacaoSelecionada;


                return nomeCombina &&
                       categoriaCombina &&
                       classificacaoCombina;

            });


        mostrarItens(itensFiltrados);

    }


    // Pesquisa em tempo real

    document
        .querySelector('#pesquisa')
        .addEventListener(
            'input',
            filtrarItens
        );


    // Filtro de categoria

    document
        .querySelector('#categoria')
        .addEventListener(
            'change',
            filtrarItens
        );


    // Filtro de classificação

    document
        .querySelector('#classificacao')
        .addEventListener(
            'change',
            filtrarItens
        );


    // Botão Filtrar

    document
        .querySelector('.botao-filtrar')
        .addEventListener(
            'click',
            filtrarItens
        );


    // Carrega os itens uma única vez

    carregarItens();


    // Modal

    const modal =
        document.querySelector('#modal-item');

    const btnIncluir =
        document.querySelector('#btn-incluir');

    const btnFechar =
        document.querySelector('#fechar-modal');

    const btnCancelar =
        document.querySelector('#cancelar');


    // Abrir modal

    btnIncluir.addEventListener('click', () => {

        modal.style.display = 'flex';

    });


    // Fechar modal

    btnFechar.addEventListener('click', () => {

        modal.style.display = 'none';

    });


    // Cancelar

    btnCancelar.addEventListener('click', () => {

        modal.style.display = 'none';

    });


    // Cadastrar / editar item

    document
        .querySelector('#form-item')
        .addEventListener(
            'submit',
            async (evento) => {

                evento.preventDefault();


                const parametros =
                    new URLSearchParams();


                parametros.append(
                    'nome',
                    document
                        .querySelector('#nome')
                        .value
                );


                parametros.append(
                    'categoria',
                    document
                        .querySelector('#categoria-item')
                        .value
                );


                parametros.append(
                    'classificacao',
                    document
                        .querySelector('#classificacao-item')
                        .value
                );


                parametros.append(
                    'dano',
                    document
                        .querySelector('#dano')
                        .value
                );


                parametros.append(
                    'critico',
                    document
                        .querySelector('#critico')
                        .value
                );


                parametros.append(
                    'alcance',
                    document
                        .querySelector('#alcance')
                        .value
                );


                parametros.append(
                    'espaco',
                    document
                        .querySelector('#espaco')
                        .value
                );


                parametros.append(
                    'descricao',
                    document
                        .querySelector('#descricao')
                        .value
                );


                let resposta;


                // EDITANDO

                if (itemEditando !== null) {

                    resposta =
                        await fetch(
                            `/api/item/${itemEditando.id}`,
                            {

                                method: 'PUT',

                                headers: {

                                    'Content-Type':
                                        'application/x-www-form-urlencoded'

                                },

                                body: parametros

                            }
                        );


                // CADASTRANDO

                } else {

                    resposta =
                        await fetch(
                            '/api/item',
                            {

                                method: 'POST',

                                headers: {

                                    'Content-Type':
                                        'application/x-www-form-urlencoded'

                                },

                                body: parametros

                            }
                        );

                }


                if (resposta.ok) {

                    alert(

                        itemEditando !== null

                            ? 'Item atualizado com sucesso!'

                            : 'Item cadastrado com sucesso!'

                    );


                    modal.style.display = 'none';


                    document
                        .querySelector('#form-item')
                        .reset();


                    itemEditando = null;


                    document
                        .querySelector(
                            '.modal-cabecalho h2'
                        )
                        .textContent = 'Novo Item';


                    document
                        .querySelector(
                            '.botao-cadastrar'
                        )
                        .textContent = 'Cadastrar';


                    carregarItens();


                } else {

                    alert(
                        'Erro ao salvar o item.'
                    );

                }

            }
        );


    let itemEditando = null;


    async function editarItem(id) {

        const item =
            itens.find(
                item => item.id === id
            );


        if (!item) {

            alert('Item não encontrado.');

            return;

        }


        itemEditando = item;


        document.querySelector('#nome').value =
            item.nome;


        document.querySelector('#categoria-item').value =
            item.categoria;


        document.querySelector('#classificacao-item').value =
            item.classificacao;


        document.querySelector('#dano').value =
            item.dano;


        document.querySelector('#critico').value =
            item.critico;


        document.querySelector('#alcance').value =
            item.alcance;


        document.querySelector('#espaco').value =
            item.espaco;


        document.querySelector('#descricao').value =
            item.descricao;


        document
            .querySelector('.modal-cabecalho h2')
            .textContent = 'Editar Item';


        document
            .querySelector('.botao-cadastrar')
            .textContent = 'Salvar';


        modal.style.display = 'flex';

    }

</script>

</body>

</html>
